<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopDemo — Мини-магазин</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #0f172a; }
    .container { max-width: 1140px; margin: 0 auto; padding: 0 24px; }
    
    header { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 0; position: sticky; top: 0; z-index: 50; }
    header .container { display: flex; justify-content: space-between; align-items: center; height: 68px; }
    .logo { font-weight: 800; font-size: 22px; color: #2563eb; }
    .cart-btn {
      background: #2563eb; color: #fff; border: none; padding: 11px 20px;
      border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 14px;
      display: flex; align-items: center; gap: 8px;
    }
    .cart-btn:hover { background: #1d4ed8; }
    
    .hero { padding: 48px 0 20px; text-align: center; }
    .hero h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 8px; }
    .hero p { color: #64748b; font-size: 16px; }
    
    .filters { display: flex; gap: 10px; justify-content: center; margin: 28px 0 36px; flex-wrap: wrap; }
    .filter-btn {
      padding: 9px 18px; border: 1.5px solid #e2e8f0; background: #fff;
      border-radius: 100px; cursor: pointer; font-size: 14px; font-weight: 500; transition: 0.2s;
    }
    .filter-btn.active, .filter-btn:hover { background: #2563eb; color: #fff; border-color: #2563eb; }
    
    .products { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 24px; padding-bottom: 80px; }
    .product {
      background: #fff; border-radius: 16px; overflow: hidden;
      border: 1px solid #e2e8f0; transition: 0.25s; box-shadow: 0 4px 16px rgba(0,0,0,0.04);
    }
    .product:hover { transform: translateY(-6px); box-shadow: 0 16px 40px rgba(0,0,0,0.1); }
    .product-img { height: 180px; overflow: hidden; }
    .product-img img { width: 100%; height: 100%; object-fit: cover; transition: 0.4s; }
    .product:hover .product-img img { transform: scale(1.05); }
    .product-body { padding: 18px; }
    .product h3 { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
    .product .price { font-weight: 800; font-size: 18px; color: #2563eb; margin-bottom: 14px; }
    .add-btn {
      width: 100%; padding: 11px; background: #f1f5f9; border: none;
      border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 14px; transition: 0.2s;
    }
    .add-btn:hover { background: #2563eb; color: #fff; }
    
    .cart-panel {
      position: fixed; top: 0; right: -340px; width: 320px; height: 100%;
      background: #fff; box-shadow: -8px 0 30px rgba(0,0,0,0.12); transition: right 0.3s;
      z-index: 100; padding: 24px; display: flex; flex-direction: column;
    }
    .cart-panel.open { right: 0; }
    .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .cart-header h3 { font-size: 18px; font-weight: 700; }
    .close-cart { background: none; border: none; font-size: 24px; cursor: pointer; color: #64748b; }
    .cart-items { flex: 1; overflow-y: auto; }
    .cart-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
    .cart-total { margin-top: 20px; padding-top: 16px; border-top: 2px solid #e2e8f0; font-weight: 800; font-size: 20px; }
    
    footer { text-align: center; padding: 28px; color: #94a3b8; font-size: 13px; background: #fff; border-top: 1px solid #e2e8f0; }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <div class="logo">ShopDemo</div>
      <button class="cart-btn" onclick="toggleCart()">🛒 Корзина (<span id="cart-count">0</span>)</button>
    </div>
  </header>

  <div class="container">
    <div class="hero">
      <h1>Каталог товаров</h1>
      <p>Демонстрация простого и удобного интернет-магазина</p>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">Все</button>
      <button class="filter-btn" data-filter="clothes">Одежда</button>
      <button class="filter-btn" data-filter="accessories">Аксессуары</button>
      <button class="filter-btn" data-filter="home">Для дома</button>
    </div>

    <div class="products" id="products"></div>
  </div>

  <div class="cart-panel" id="cart">
    <div class="cart-header">
      <h3>Корзина</h3>
      <button class="close-cart" onclick="toggleCart()">×</button>
    </div>
    <div class="cart-items" id="cart-items"></div>
    <div class="cart-total">Итого: <span id="cart-total">0</span> ₽</div>
  </div>

  <footer>Демо-проект для портфолио веб-разработчика</footer>

  <script>
    const products = [
      { id: 1, name: 'Футболка базовая', price: 1490, category: 'clothes', img: 'https://images.unsplash.com/photo-1521572163474-6854f9bf17f?w=400&q=80' },
      { id: 2, name: 'Джинсы slim fit', price: 3990, category: 'clothes', img: 'https://images.unsplash.com/photo-1542272604-787c3835535d?w=400&q=80' },
      { id: 3, name: 'Кроссовки city', price: 5990, category: 'clothes', img: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&q=80' },
      { id: 4, name: 'Рюкзак городской', price: 2790, category: 'accessories', img: 'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=400&q=80' },
      { id: 5, name: 'Часы минимализм', price: 4590, category: 'accessories', img: 'https://images.unsplash.com/photo-1524592094714-0f0654e20314?w=400&q=80' },
      { id: 6, name: 'Подушка декоративная', price: 990, category: 'home', img: 'https://images.unsplash.com/photo-1584100936595-c0654b55a2e2?w=400&q=80' },
      { id: 7, name: 'Настольный светильник', price: 2490, category: 'home', img: 'https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=400&q=80' },
      { id: 8, name: 'Кружка керамическая', price: 690, category: 'home', img: 'https://images.unsplash.com/photo-1514228742587-6b1558fcca3d?w=400&q=80' },
    ];

    let cart = [];
    let currentFilter = 'all';

    function renderProducts() {
      const list = currentFilter === 'all' ? products : products.filter(p => p.category === currentFilter);
      document.getElementById('products').innerHTML = list.map(p => `
        <div class="product">
          <div class="product-img"><img src="${p.img}" alt="${p.name}"></div>
          <div class="product-body">
            <h3>${p.name}</h3>
            <div class="price">${p.price.toLocaleString()} ₽</div>
            <button class="add-btn" onclick="addToCart(${p.id})">В корзину</button>
          </div>
        </div>
      `).join('');
    }

    function addToCart(id) {
      const product = products.find(p => p.id === id);
      cart.push(product);
      updateCart();
    }

    function updateCart() {
      document.getElementById('cart-count').textContent = cart.length;
      document.getElementById('cart-items').innerHTML = cart.length
        ? cart.map(p => `<div class="cart-item"><span>${p.name}</span><span>${p.price.toLocaleString()} ₽</span></div>`).join('')
        : '<p style="color:#94a3b8;font-size:14px;padding:20px 0;">Корзина пуста</p>';
      document.getElementById('cart-total').textContent = cart.reduce((s, p) => s + p.price, 0).toLocaleString();
    }

    function toggleCart() {
      document.getElementById('cart').classList.toggle('open');
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderProducts();
      });
    });

    renderProducts();
  </script>
</body>
</html>
